# Put this file in /etc/nginx/conf.d/ or /etc/nginx/sites-available + symlink.
# limit_req_zone must be in the http context; conf.d is included there.

limit_req_zone $binary_remote_addr zone=ph_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ph_auth:10m rate=5r/m;

server {
    listen 80;
    server_name www.agentworkout.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.agentworkout.online;

    ssl_certificate     /etc/letsencrypt/live/www.agentworkout.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.agentworkout.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /opt/planharness/frontend/dist;
    index index.html;
    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Demo login: stricter rate limit (5 requests/minute per IP).
    location = /api/v1/auth/demo {
        limit_req zone=ph_auth burst=3 nodelay;
        proxy_pass http://127.0.0.1:9200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /api/ {
        limit_req zone=ph_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:9200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
