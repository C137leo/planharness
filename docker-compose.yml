services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: planharness
      POSTGRES_USER: planharness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planharness -d planharness"]
      interval: 5s
      timeout: 3s
      retries: 20
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=20
    mem_limit: 512m
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://planharness:${POSTGRES_PASSWORD}@db:5432/planharness
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    mem_limit: 128m
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
