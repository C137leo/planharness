[project]
name = "planharness-api"
version = "0.1.0"
description = "PlanHarness backend: plan repair harness demo"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic-settings>=2.5",
  "pyjwt>=2.9",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "langgraph>=1.2.19",
  "langgraph-checkpoint-postgres>=3",
  "psycopg-pool>=3",   # checkpointer 直接用连接池；虽然它是上面包的传递依赖，但我们要 import，显式声明
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
